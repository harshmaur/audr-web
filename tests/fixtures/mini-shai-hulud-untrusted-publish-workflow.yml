name: Synthetic Mini Shai-Hulud release workflow
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    if: github.event.comment.body == 'npm publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        run: |
          git fetch origin pull/${{ github.event.issue.number }}/head:pr-find-commit
          git checkout pr-find-commit
      - name: Install dependencies
        run: pnpm install
      - name: Publish canary
        run: pnpm publish --no-git-checks --tag canary
